name: Build, test and upload both editions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_microsoft_store:
        description: Explicitly upload to Microsoft Store (requires owner instruction)
        type: boolean
        default: false
      replace_pending_store_submission:
        description: Cancel a Store submission still in certification and submit this build instead (requires owner instruction)
        type: boolean
        default: false
      publish_ios:
        description: Explicitly upload to TestFlight (requires owner instruction)
        type: boolean
        default: false
      publish_mobile_pages:
        description: Explicitly deploy mobile Pages (requires owner instruction)
        type: boolean
        default: false
      submit_ios_review:
        description: Submit an already processed TestFlight build for App Store review, release manual (requires owner instruction)
        type: boolean
        default: false
      ios_review_version:
        description: App Store version to submit (e.g. 1.1.1)
        type: string
        default: ''
      ios_review_build:
        description: TestFlight build number to submit (e.g. 239.2)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      windows_changed: ${{ steps.changes.outputs.windows_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Windows package changes
        id: changes
        shell: pwsh
        run: |
          $changed=$true
          if($env:GITHUB_EVENT_NAME -in @('push','pull_request')){
            $paths=@(git diff --name-only HEAD^ HEAD)
            if($LASTEXITCODE -ne 0){throw 'Cannot determine changed package inputs'}
            $changed=[bool]@($paths | Where-Object {$_ -match '^(src/|store/|scripts/Build-(User|Admin|MSIX)\.ps1$|scripts/submit_store\.py$)'})
          }
          "windows_changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Validate no private signing material
        shell: pwsh
        run: |
          $bad=git ls-files | Where-Object {$_ -match '(?i)(AdminPrivateKey|\.dtcekey$|\.dat$|\.pfx$|\.p12$|Owner-WithKey)'}
          if($bad){throw 'Private signing material must not be committed'}
      - name: Test calculations and access protocol
        shell: pwsh
        run: ./scripts/Test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-Workspace-Previews
          path: test-results/ui-*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-Store-Screenshots
          path: test-results/store-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Test Store submission payload
        run: python -m unittest discover -s tests -p test_store_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-Native-Test-Fixture
          path: |
            test-results/mobile-fixture.json
            test-results/mobile-public.json
            test-results/mobile-code.txt
            test-results/mobile-cert.txt
          retention-days: 1
          if-no-files-found: error
      - name: Build mobile access generator
        shell: pwsh
        run: ./scripts/Build-Mobile.ps1
      - name: Build User only
        shell: pwsh
        run: ./scripts/Build-User.ps1
      - name: Build key-free Admin
        shell: pwsh
        run: ./scripts/Build-Admin.ps1
      - name: Build and validate Admin Store MSIX
        shell: pwsh
        run: ./scripts/Build-MSIX.ps1 -Edition Admin
      - name: Build and validate Store MSIX
        shell: pwsh
        run: ./scripts/Build-MSIX.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-Tool-Kit-Packages
          path: |
            dist/DTCE-Tool-Kit-User.zip
            dist/DTCE-Tool-Kit-Admin.zip
            dist/DTCE-Mobile-Access.zip
            dist/*.msix
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.windows_changed == 'true' && !contains(github.event.head_commit.message, '[checkpoint]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Tool-Kit-Packages
          path: release
      - name: Publish successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Owner (19 November 2026): name each release after the app version it carries (taken from the MSIX package version).
          VERSION=$(ls release/*.msix | head -n 1 | sed -nE 's/.*_([0-9]+\.[0-9]+\.[0-9]+)\.0_x64\.msix$/\1/p')
          if [ -n "$VERSION" ]; then TAG="v${VERSION}-build-${GITHUB_RUN_NUMBER}"; TITLE="DTCE Tool Kit v${VERSION} - build ${GITHUB_RUN_NUMBER}"; else TAG="build-${GITHUB_RUN_NUMBER}"; TITLE="DTCE Tool Kit - successful build ${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" release/DTCE-Tool-Kit-User.zip release/DTCE-Tool-Kit-Admin.zip release/DTCE-Mobile-Access.zip release/*.msix --target "$GITHUB_SHA" --title "$TITLE" --notes "User and key-free Admin builds. Calculations and signed-access checks passed. Commit: ${GITHUB_SHA}. Private signing keys are excluded. Includes separate User and Admin MSIX packages. Package generation does not submit or certify the app."
  store-user-upload:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_microsoft_store == true && vars.STORE_AUTO_UPLOAD_ENABLED == 'true' && needs.build.outputs.windows_changed == 'true'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: microsoft-store-user
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Tool-Kit-Packages
          path: store-package
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Store-Screenshots
          path: store-screenshots
      - name: Upload and submit User MSIX to Microsoft Store
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_CERTIFICATION_NOTES: ${{ secrets.STORE_CERTIFICATION_NOTES }}
          STORE_SCREENSHOT_DIR: store-screenshots/User
          STORE_EDITION: User
          STORE_REPLACE_PENDING: ${{ inputs.replace_pending_store_submission }}
          STORE_APP_ID: 9NSQN0157W5K
          STORE_RELEASE_NOTES: ${{ vars.STORE_RELEASE_NOTES }}
        run: |
          $packages=@(Get-ChildItem store-package -Filter DTCE-Tool-Kit_*.msix)
          if($packages.Count -ne 1){throw 'Exactly one validated User MSIX is required'}
          python scripts/submit_store.py $packages[0].FullName
          if($LASTEXITCODE -ne 0){throw 'Store submission did not complete successfully'}

  store-admin-upload:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_microsoft_store == true && vars.STORE_ADMIN_AUTO_UPLOAD_ENABLED == 'true' && needs.build.outputs.windows_changed == 'true'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: microsoft-store-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Tool-Kit-Packages
          path: store-package
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Store-Screenshots
          path: store-screenshots
      - name: Upload and submit Admin MSIX to Microsoft Store
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_CERTIFICATION_NOTES: ${{ secrets.STORE_ADMIN_CERTIFICATION_NOTES }}
          STORE_SCREENSHOT_DIR: store-screenshots/Admin
          STORE_EDITION: Admin
          STORE_REPLACE_PENDING: ${{ inputs.replace_pending_store_submission }}
          STORE_APP_ID: 9P53CR08ZSZ3
          STORE_RELEASE_NOTES: ${{ vars.STORE_ADMIN_RELEASE_NOTES }}
        run: |
          $packages=@(Get-ChildItem store-package -Filter DTCE-Tool-Kit-Admin_*.msix)
          if($packages.Count -ne 1){throw 'Exactly one validated Admin MSIX is required'}
          python scripts/submit_store.py $packages[0].FullName
          if($LASTEXITCODE -ne 0){throw 'Store submission did not complete successfully'}

  mobile-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_mobile_pages == true && vars.MOBILE_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Tool-Kit-Packages
          path: packages
      - name: Extract key-free mobile web app only
        run: unzip packages/DTCE-Mobile-Access.zip -d mobile-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-site
      - name: Deploy iPhone web app
        id: deployment
        uses: actions/deploy-pages@v4

  native-ios:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-Native-Test-Fixture
          path: ios-fixture
      - name: Check native public key configuration
        run: cmp mobile/public-key.json ios/DTCEAccess/public-key.json
      - name: Test native crypto against desktop and Web Crypto
        run: |
          swiftc ios/DTCEAccess/AccessCrypto.swift ios/Tests/main.swift -o native-crypto-tests
          ./native-crypto-tests ios-fixture
      - name: Test demo and owner model separation
        run: |
          swiftc -parse-as-library ios/DTCEAccess/AccessCrypto.swift ios/DTCEAccess/KeyVault.swift ios/DTCEAccess/AccessModel.swift ios/Tests/DemoModelTests.swift -o native-demo-model-tests
          ./native-demo-model-tests
      - name: Select current Xcode for iPhone UI tests
        shell: bash
        run: |
          developer_dir=$(python3 - <<'PYCODE'
          import re
          from pathlib import Path
          choices=[]
          for app in Path('/Applications').glob('Xcode*.app'):
              match=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app',app.name)
              if match and int(match[1].split('.')[0])>=26:
                  choices.append((tuple(map(int,match[1].split('.'))),app))
          print(max(choices)[1]/'Contents/Developer')
          PYCODE
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Test visible demo flow on iPhone simulator
        run: bash ios/ci/test_demo_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DTCE-iOS-Demo-Screenshots
          path: test-results/ios-demo-screenshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Build native iPhone simulator app
        run: xcodebuild -project ios/DTCEAccess.xcodeproj -scheme DTCEAccess -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone archive
        run: xcodebuild -project ios/DTCEAccess.xcodeproj -scheme DTCEAccess -configuration Release -destination 'generic/platform=iOS' -archivePath ios-build/DTCEAccess.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package native build for review (not installable without Apple signing)
        run: |
          ditto -c -k --keepParent ios-build/DTCEAccess.xcarchive DTCE-Access-iOS-unsigned.xcarchive.zip
          ditto -c -k --keepParent ios-build/Build/Products/Debug-iphonesimulator/DTCEAccess.app DTCE-Access-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-Access-Native-iOS
          path: |
            DTCE-Access-iOS-unsigned.xcarchive.zip
            DTCE-Access-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30

  testflight-upload:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_ios == true && vars.IOS_TESTFLIGHT_DISABLED != 'true'
    needs: native-ios
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: apple-testflight-native
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Apple upload authentication implementation
        run: python3 -m unittest discover -s tests -p test_apple_upload.py
      - name: Validate Apple credentials and app record
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-ASC-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Select an installed release Xcode 26 or newer
        shell: bash
        run: |
          developer_dir=$(python3 - <<'PY'
          import re
          from pathlib import Path
          choices=[]
          for app in Path('/Applications').glob('Xcode*.app'):
              match=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app',app.name)
              if match and int(match[1].split('.')[0])>=26:
                  choices.append((tuple(map(int,match[1].split('.'))),app))
          if not choices:
              raise SystemExit('No release Xcode 26+ found. Use a GitHub macOS image containing the current Apple SDK.')
          print(max(choices)[1]/'Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - name: Cloud sign and upload the native iPhone app
        shell: bash
        run: bash ios/ci/upload_testflight.sh
      - name: Verify Apple build processing
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: python3 ios/ci/app_store.py check "$APPLE_APP_ID" "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
      - name: Remove temporary API private key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi

  ios-review-submit:
    # Owner request only: attaches an already processed TestFlight build to its App Store version and submits it for review.
    # The release after approval is manual; nothing is built or uploaded here.
    if: github.event_name == 'workflow_dispatch' && inputs.submit_ios_review == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: apple-app-store-review
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Apple credentials and app record
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-ASC-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Submit for App Store review
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
          REVIEW_VERSION: ${{ inputs.ios_review_version }}
          REVIEW_BUILD: ${{ inputs.ios_review_build }}
        run: python3 ios/ci/app_store.py submit "$APPLE_APP_ID" "$REVIEW_VERSION" "$REVIEW_BUILD"
      - name: Remove temporary API private key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi
