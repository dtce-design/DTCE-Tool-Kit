name: App Store publication readiness
on:
  push:
    branches: [codex/app-store-publication]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Apple
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-AppStore-$GITHUB_RUN_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Inspect public release requirements
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: python3 ios/ci/app_store_release.py "$APPLE_APP_ID"
      - name: Remove temporary Apple API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi
  screenshots:
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select current Xcode
        run: |
          developer_dir=$(python3 - <<'PY'
          import re
          from pathlib import Path
          choices=[]
          for app in Path('/Applications').glob('Xcode*.app'):
              match=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app',app.name)
              if match and int(match[1].split('.')[0])>=26:
                  choices.append((tuple(map(int,match[1].split('.'))),app))
          print(max(choices)[1]/'Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Capture actual iPhone listing screenshot
        run: |
          bash ios/ci/capture_store_screenshot.sh
          sips -s format jpeg -s formatOptions 100 test-results/ios-app-store/DTCE-Access-iPhone.png --out test-results/ios-app-store/DTCE-Access-iPhone.jpg > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: DTCE-iOS-AppStore-Screenshots
          path: test-results/ios-app-store/
          if-no-files-found: error
          retention-days: 30
  prepare-listing:
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-iOS-AppStore-Screenshots
          path: ios-store-screenshots
      - name: Authenticate with Apple
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-Draft-$GITHUB_RUN_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Fill missing draft listing fields
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,"ios/ci")
          __file__="ios/ci/app_store_draft.py"
          """Fill missing native iOS listing fields; never submit or overwrite existing copy."""
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path
          from app_store import API, api_get, jwt, required
          
          
          def write(resource, body):
              token = jwt(required('ASC_KEY_PATH'), required('ASC_KEY_ID'), required('ASC_ISSUER_ID'))
              request = urllib.request.Request(API + resource, data=json.dumps(body).encode(), method='PATCH', headers={'Authorization':'Bearer ' + token, 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Only print error codes and field paths, never Apple credentials or contact data.
                  try:
                      errors = json.loads(error.read()).get('errors', [])
                      codes = ', '.join(str(item.get('code')) + ' ' + str(item.get('source', {}).get('pointer', '')) for item in errors)
                  except (ValueError, AttributeError):
                      codes = ''
                  raise RuntimeError('Apple draft update failed: HTTP ' + str(error.code) + ' ' + codes) from None
          
          
          def fill(resource, kind, identifier, current, proposed):
              attributes = {name:value for name,value in proposed.items() if value and not current.get(name)}
              if attributes:
                  write(resource + '/' + identifier, {'data':{'type':kind, 'id':identifier, 'attributes':attributes}})
                  print('Prepared ' + resource + ': ' + ', '.join(attributes))
          
          
          def prepare(app_id):
              content = json.loads((Path(__file__).parents[1] / 'store/listing.en-US.json').read_text())
              versions = api_get('apps/' + app_id + '/appStoreVersions').get('data', [])
              versions = [row for row in versions if row['attributes'].get('platform') == 'IOS' and row['attributes'].get('appStoreState') == 'PREPARE_FOR_SUBMISSION']
              if len(versions) != 1:
                  raise ValueError('Expected one editable iOS version; existing releases were not changed.')
              version = versions[0]
              fill('appStoreVersions', 'appStoreVersions', version['id'], version['attributes'], {'copyright':content['copyright']})
              for localized in api_get('appStoreVersions/' + version['id'] + '/appStoreVersionLocalizations').get('data', []):
                  if localized['attributes']['locale'] == 'en-US':
                      fill('appStoreVersionLocalizations', 'appStoreVersionLocalizations', localized['id'], localized['attributes'], {key:content.get(key) for key in ('description','keywords','supportUrl')})
              for info in api_get('apps/' + app_id + '/appInfos').get('data', []):
                  if info['attributes'].get('appStoreState') != 'PREPARE_FOR_SUBMISSION':
                      continue
                  category = api_get('appInfos/' + info['id'] + '/relationships/primaryCategory')
                  if not category.get('data'):
                      write('appInfos/' + info['id'], {'data':{'type':'appInfos', 'id':info['id'], 'relationships':{'primaryCategory':{'data':{'type':'appCategories','id':content['primaryCategory']}}}}})
                      print('Prepared primary category: Utilities')
                  for localized in api_get('appInfos/' + info['id'] + '/appInfoLocalizations').get('data', []):
                      if localized['attributes']['locale'] == 'en-US':
                          fill('appInfoLocalizations', 'appInfoLocalizations', localized['id'], localized['attributes'], {key:content.get(key) for key in ('subtitle','privacyPolicyUrl')})
              print('Draft copy is prepared. Review contact, privacy/support URLs and reviewer access are still required before submission.')
          
          
          
          prepare(os.environ["APPLE_APP_ID"])
          PY
      - name: Upload actual iPhone screenshot
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,"ios/ci")
          __file__="ios/ci/app_store_screenshot.py"
          """Upload an actual iPhone screenshot to an editable Apple listing."""
          import hashlib
          import json
          import sys
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path
          from app_store import API, api_get, jwt, required
          
          
          def write(resource, method, body):
              token = jwt(required('ASC_KEY_PATH'), required('ASC_KEY_ID'), required('ASC_ISSUER_ID'))
              request = urllib.request.Request(API + resource, data=json.dumps(body).encode(), method=method, headers={'Authorization':'Bearer ' + token, 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      errors = json.loads(error.read()).get('errors', [])
                      codes = ', '.join(str(item.get('code')) + ' ' + str(item.get('source', {}).get('pointer', '')) for item in errors)
                  except (ValueError, AttributeError):
                      codes = ''
                  raise RuntimeError('Apple screenshot request failed: HTTP ' + str(error.code) + ' ' + codes) from None
          
          
          def upload(app_id, path):
              versions = api_get('apps/' + app_id + '/appStoreVersions').get('data', [])
              versions = [v for v in versions if v['attributes'].get('platform') == 'IOS' and v['attributes'].get('appStoreState') == 'PREPARE_FOR_SUBMISSION']
              if len(versions) != 1:
                  raise ValueError('Expected one editable iOS version. Existing releases were not changed.')
              localizations = api_get('appStoreVersions/' + versions[0]['id'] + '/appStoreVersionLocalizations').get('data', [])
              locale = next(v for v in localizations if v['attributes']['locale'] == 'en-US')
              sets = api_get('appStoreVersionLocalizations/' + locale['id'] + '/appScreenshotSets').get('data', [])
              # Apple's largest iPhone API bucket is APP_IPHONE_67, including 1320x2868 Pro Max images.
              group = next((v for v in sets if v['attributes']['screenshotDisplayType'] == 'APP_IPHONE_67'), None)
              if group is None:
                  group = write('appScreenshotSets', 'POST', {'data':{'type':'appScreenshotSets','attributes':{'screenshotDisplayType':'APP_IPHONE_67'},'relationships':{'appStoreVersionLocalization':{'data':{'type':'appStoreVersionLocalizations','id':locale['id']}}}}})['data']
              images = api_get('appScreenshotSets/' + group['id'] + '/appScreenshots').get('data', [])
              if images:
                  print('Existing iPhone screenshot set retained; no images were replaced.')
                  return
              data = path.read_bytes()
              image = write('appScreenshots', 'POST', {'data':{'type':'appScreenshots','attributes':{'fileName':path.name,'fileSize':len(data)},'relationships':{'appScreenshotSet':{'data':{'type':'appScreenshotSets','id':group['id']}}}}})['data']
              for operation in image['attributes']['uploadOperations']:
                  headers = {v['name']:v['value'] for v in operation.get('requestHeaders', [])}
                  chunk = data[operation['offset']:operation['offset']+operation['length']]
                  request = urllib.request.Request(operation['url'], data=chunk, headers=headers, method=operation['method'])
                  # Signed upload URLs are never logged and never receive our Apple API JWT.
                  with urllib.request.urlopen(request, timeout=120) as response:
                      response.read()
              write('appScreenshots/' + image['id'], 'PATCH', {'data':{'type':'appScreenshots','id':image['id'],'attributes':{'uploaded':True,'sourceFileChecksum':hashlib.md5(data).hexdigest()}}})
              for _ in range(30):
                  state = (api_get('appScreenshots/' + image['id'])['data']['attributes'].get('assetDeliveryState') or {}).get('state')
                  print('Apple screenshot processing: ' + str(state))
                  if state == 'COMPLETE':
                      print('Actual iPhone screenshot uploaded and processed successfully.')
                      return
                  if state == 'FAILED':
                      raise RuntimeError('Apple screenshot processing failed. Inspect the listing asset in App Store Connect.')
                  time.sleep(2)
              raise RuntimeError('Screenshot uploaded; processing is still pending. Check the existing asset before retrying.')
          
          
          
          upload(os.environ["APPLE_APP_ID"], Path("ios-store-screenshots/DTCE-Access-iPhone.jpg"))
          PY
      - name: Remove temporary Apple API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi

  hold-unlisted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Apple
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-Unlisted-$GITHUB_RUN_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Hold release for requested Unlisted distribution
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: |
          python3 - <<'PY'
          import os,sys,json,urllib.request,urllib.error
          sys.path.insert(0,'ios/ci')
          from app_store import API,api_get,jwt,required
          versions=api_get('apps/'+os.environ['APPLE_APP_ID']+'/appStoreVersions').get('data',[])
          versions=[v for v in versions if v['attributes'].get('platform')=='IOS' and v['attributes'].get('appStoreState')=='PREPARE_FOR_SUBMISSION']
          if len(versions)!=1:raise ValueError('Expected one editable iOS draft; no release was changed.')
          version=versions[0]
          if version['attributes'].get('releaseType')!='MANUAL':
              token=jwt(required('ASC_KEY_PATH'),required('ASC_KEY_ID'),required('ASC_ISSUER_ID'))
              payload={'data':{'type':'appStoreVersions','id':version['id'],'attributes':{'releaseType':'MANUAL'}}}
              request=urllib.request.Request(API+'appStoreVersions/'+version['id'],data=json.dumps(payload).encode(),method='PATCH',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:json.load(response)
              except urllib.error.HTTPError as error:raise RuntimeError('Apple manual release update failed: HTTP '+str(error.code)) from None
          current=api_get('appStoreVersions/'+version['id'])['data']['attributes']
          print('iOS version: '+current['versionString'])
          print('App Store state: '+current['appStoreState'])
          print('Release type: '+current['releaseType'])
          if current['releaseType']!='MANUAL':raise RuntimeError('Manual release was not confirmed.')
          print('Release held pending App Review and separate Apple Unlisted distribution approval.')
          PY
      - name: Remove temporary Apple API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi

  set-public-links:
    needs: hold-unlisted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public GitHub Pages links without authentication
        run: |
          python3 - <<'PY'
          import urllib.request,time
          links={'privacy':'https://dtce-design.github.io/Support-Page/dtce-access-admin/privacy.html','support':'https://dtce-design.github.io/Support-Page/dtce-access-admin/support.html'}
          for name,url in links.items():
              for attempt in range(24):
                  try:
                      with urllib.request.urlopen(url,timeout=20) as response:
                          text=response.read().decode()
                          if response.status!=200 or 'DTCE Tool Kit Access Admin' not in text:raise ValueError('Unexpected page content')
                      print('Public '+name+' page verified: '+url)
                      break
                  except Exception:
                      if attempt==23:raise RuntimeError('Public '+name+' URL is not available; Apple listing was not changed.') from None
                      time.sleep(5)
          PY
      - name: Authenticate with Apple
        id: apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-Policy-$GITHUB_RUN_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Save privacy and support URLs in the Apple draft
        env:
          APPLE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: |
          python3 - <<'PY'
          import os,sys,json,urllib.request,urllib.error
          sys.path.insert(0,'ios/ci')
          from app_store import API,api_get,jwt,required
          app_id=os.environ['APPLE_APP_ID']
          def patch(resource,kind,identifier,attribute,url):
              current=api_get(resource+'/'+identifier)['data']['attributes'].get(attribute)
              if current and current!=url:raise ValueError('An existing different '+attribute+' needs review; it was not overwritten.')
              if current!=url:
                  token=jwt(required('ASC_KEY_PATH'),required('ASC_KEY_ID'),required('ASC_ISSUER_ID'))
                  payload={'data':{'type':kind,'id':identifier,'attributes':{attribute:url}}}
                  request=urllib.request.Request(API+resource+'/'+identifier,data=json.dumps(payload).encode(),method='PATCH',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(request,timeout=60) as response:json.load(response)
                  except urllib.error.HTTPError as error:raise RuntimeError('Apple URL update failed: HTTP '+str(error.code)) from None
              saved=api_get(resource+'/'+identifier)['data']['attributes'].get(attribute)
              if saved!=url:raise RuntimeError('Apple did not retain '+attribute)
              print('Apple '+attribute+' saved: '+saved)
          infos=[v for v in api_get('apps/'+app_id+'/appInfos').get('data',[]) if v['attributes'].get('appStoreState')=='PREPARE_FOR_SUBMISSION']
          versions=[v for v in api_get('apps/'+app_id+'/appStoreVersions').get('data',[]) if v['attributes'].get('platform')=='IOS' and v['attributes'].get('appStoreState')=='PREPARE_FOR_SUBMISSION']
          if len(infos)!=1 or len(versions)!=1:raise ValueError('Expected one editable Apple draft.')
          for loc in api_get('appInfos/'+infos[0]['id']+'/appInfoLocalizations').get('data',[]):
              if loc['attributes'].get('locale')=='en-US':patch('appInfoLocalizations','appInfoLocalizations',loc['id'],'privacyPolicyUrl','https://dtce-design.github.io/Support-Page/dtce-access-admin/privacy.html')
          for loc in api_get('appStoreVersions/'+versions[0]['id']+'/appStoreVersionLocalizations').get('data',[]):
              if loc['attributes'].get('locale')=='en-US':patch('appStoreVersionLocalizations','appStoreVersionLocalizations',loc['id'],'supportUrl','https://dtce-design.github.io/Support-Page/dtce-access-admin/support.html')
          print('Public links configured. App release remains held for Unlisted review.')
          PY
      - name: Remove temporary Apple API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f -- "$ASC_KEY_PATH"
          fi
