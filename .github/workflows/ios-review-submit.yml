name: Submit tested iOS demo to App Review
on:
  push:
    branches: [codex/app-store-publication]
    paths:
      - .github/workflows/ios-review-submit.yml
      - ios/ci/prepare_app_review.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-app-review-submission
  cancel-in-progress: false
jobs:
  submit-review:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_BUILD_NUMBER: '48.1'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Apple
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/DTCE-Submit-$GITHUB_RUN_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          python3 ios/ci/app_store.py prepare
      - name: Wait for the exact tested main build and Apple processing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,sys,json,time,urllib.request
          sys.path.insert(0,'ios/ci')
          from app_store import api_get
          base='https://api.github.com/repos/dtce-design/DTCE-Tool-Kit/actions/runs/42140347537'
          def github(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          last=None
          for _ in range(100):
              run=github(base)
              if run['head_sha']!='a7d01cf1c0fa77e530bd46763e6e6698b8fbdf48':raise RuntimeError('Unexpected source revision')
              jobs=github(base+'/jobs')['jobs']
              required=[next((j for j in jobs if j['name']==name),None) for name in ('build','native-ios')]
              if any(j and j['status']=='completed' and j['conclusion']!='success' for j in required):raise RuntimeError('Main validation failed; app review was not submitted.')
              validated=all(j and j['conclusion']=='success' for j in required)
              builds=api_get('builds',{'filter[app]':'6826852061','filter[version]':os.environ['APPLE_BUILD_NUMBER'],'limit':'5'}).get('data',[])
              state=builds[0]['attributes']['processingState'] if builds else 'WAITING_FOR_UPLOAD'
              if state!=last:print('Expected Apple build '+os.environ['APPLE_BUILD_NUMBER']+': '+state,flush=True);last=state
              if state in ('FAILED','INVALID'):raise RuntimeError('Apple rejected build processing; app review was not submitted.')
              if validated and len(builds)==1 and state=='VALID':
                  print('Windows/native tests and exact Apple build processing verified.');break
              time.sleep(10)
          else:raise RuntimeError('Build is still pending; check the existing upload before retrying.')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: DTCE-iOS-Demo-Screenshots
          run-id: 42140347537
          github-token: ${{ github.token }}
          path: review-test-screenshots
      - name: Prepare the actual tested screenshots for the Store
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('review-test-screenshots').resolve();out=Path('review-ready-screenshots');out.mkdir(exist_ok=True)
          manifest=json.loads((root/'manifest.json').read_text())
          for row in manifest:
              for image in row.get('attachments',[]):
                  name=image.get('suggestedHumanReadableName','').split('_0_',1)[0]
                  if not name.startswith(('DTCE-01-','DTCE-02-','DTCE-03-','DTCE-04-')):continue
                  source=(root/image['exportedFileName']).resolve()
                  if not source.is_relative_to(root):raise ValueError('Unexpected attachment path')
                  subprocess.run(['sips','-s','format','jpeg','-s','formatOptions','100',str(source),'--out',str(out/(name+'.jpg'))],check=True,capture_output=True)
          if len(list(out.glob('DTCE-*.jpg')))!=4:raise ValueError('Expected four tested iPhone screenshots')
          print('Prepared four actual iPhone screenshots; no key import or account data is shown.')
          PY
      - name: Preserve the authorized Unlisted manual release hold
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'ios/ci')
          from app_store import api_get
          from prepare_app_review import patch, APP_ID
          app=api_get('apps/'+APP_ID)['data']
          if app['attributes']['bundleId']!='com.dtce.accessadmin':raise ValueError('Unexpected app')
          version=api_get('appStoreVersions/6d4daf11-827c-45c3-85b7-7963d964531d')['data']
          attrs=version['attributes']
          print('Current version state: '+str(attrs.get('appStoreState'))+'; release: '+str(attrs.get('releaseType')))
          if attrs.get('platform')!='IOS' or attrs.get('versionString')!='1.1.0':raise ValueError('Unexpected version')
          if attrs.get('appStoreState') not in ('PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','REJECTED','METADATA_REJECTED','DEVELOPER_REJECTED'):raise ValueError('Version is not editable; inspect its review state before any change')
          if attrs.get('releaseType')!='MANUAL':patch('appStoreVersions',version['id'],{'releaseType':'MANUAL'})
          verified=api_get('appStoreVersions/'+version['id'])['data']['attributes']
          if verified.get('releaseType')!='MANUAL':raise ValueError('Manual hold was not saved')
          print('Unlisted manual release hold verified.')
          PY
      - name: Select tested build and prepare reviewer instructions
        run: python3 ios/ci/prepare_app_review.py prepare "$APPLE_BUILD_NUMBER"
      - name: Upload and verify the four current UI screenshots
        run: python3 ios/ci/prepare_app_review.py screenshots "$APPLE_BUILD_NUMBER" review-ready-screenshots
      - name: Submit to Apple review with manual release held
        run: python3 ios/ci/prepare_app_review.py submit "$APPLE_BUILD_NUMBER"
      - name: Remove temporary Apple API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then rm -f -- "$ASC_KEY_PATH"; fi
